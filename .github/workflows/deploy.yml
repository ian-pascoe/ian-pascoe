name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One run at a time per stage; never cancel a deploy/destroy mid-flight.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    # Fork PRs get no secrets; skip them.
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Deploy
        run: bun alchemy deploy --stage "$STAGE" --yes

      - name: Read preview URL
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          bun alchemy state read "ianpascoe-dev/$STAGE/output" > stack-output.txt
          url=$(grep -oE '"url": *"https://[^"]+"' stack-output.txt | head -n1 | sed -E 's/.*"(https:[^"]+)"$/\1/')
          if [ -z "$url" ]; then
            echo "::error::No url in stack output"; cat stack-output.txt; exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- alchemy-preview -->";
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              "",
              `Stage \`${process.env.STAGE}\` · commit ${context.payload.pull_request.head.sha.slice(0, 7)}`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to destroy anything but a PR stage
        run: |
          case "$STAGE" in
            pr-[0-9]*) ;;
            *) echo "::error::Refusing to destroy stage '$STAGE'"; exit 1 ;;
          esac
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Destroy preview
        run: bun alchemy destroy --stage "$STAGE" --yes
