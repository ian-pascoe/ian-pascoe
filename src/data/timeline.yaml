# Ian Pascoe's career, hung as a museum retrospective. This file is the only
# source for the site and for /resume. Achievement names are playful titles;
# the detail beside each one is the plain fact.
#
# Public-content rules: name Windchill and AWS; percentages are fine; never
# publish dollar amounts or team sizes.
#
# Dates are "YYYY", "YYYY-MM", or "YYYY-MM-DD". Spans end with `end: present`
# while they are ongoing. The build validates this file and fails with a clear
# message if something is missing or misspelled.
#
# entries:
#   - kind: span            a role, company, or degree; hung as its own room
#     id, title, org, start, end, summary
#     paint                 the room's wall color: oxblood, blue, slate,
#                           ochre, plum, or stone
#     mark                  optional logo lettered on the room sign; one of
#                           the names in src/lib/marks.ts (rtx, spirit-led, uri, ...)
#     startLabel            verb for how the room opens, e.g. "Founded" (default "Joined")
#     link                  optional { href, label }
#     achievements:         the works hung in the room (YAML order = hanging order)
#       - name              the work's title (playful)
#         detail            the plain fact, one or two sentences
#         metric            optional figure; it decides the drawing:
#                             "75%"  drawn as a reduction (100 squares, 75 taken away)
#                             "+30%" drawn as an increase (100 squares plus 30)
#                             "5", "300+"  drawn as a count of dots
#                             "1st of 15"  drawn as 15 dots, the 1st in gold
#         metricLabel       what the figure measures, e.g. "shorter test runs"
#         subject           short plain name of what was made; without a
#                           metric the work is this phrase set as a text piece
#         date              optional; undated works hang within their room
#         skills            optional list of skill tags (the work's medium);
#                           tags named in src/lib/marks.ts get their glyph
#         featured          optional; featured works hang on the title wall too
#         link              optional { href, label }
#         status            optional: in-progress or retired, shown on the label
#   - kind: event           a single dated moment: certification, launch, degree
#     id, title, date, org, detail, tag, skills, featured, link
#     mark                  optional issuer logo, set in the middle of the
#                           seal; in an event's own room, also on the room sign
#     on                    optional span id to hang the event in that room;
#                           without it the event gets a room of its own, named
#                           after its org

