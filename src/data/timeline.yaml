# Ian Pascoe's career, drawn as a transit map.
#
# PLACEHOLDER: everything below comes from resume.md and will be replaced by
# Ian's own timeline. Achievement names are drafts; edit them freely.
#
# Dates are "YYYY", "YYYY-MM", or "YYYY-MM-DD". Spans end with `end: present`
# while they are ongoing. The build validates this file and fails with a clear
# message if something is missing or misspelled.
#
# entries:
#   - kind: span            a role, company, or degree; drawn as a colored line
#     id, title, org, start, end, color, code, summary
#     startLabel            verb for the line's first station, e.g. "Founded" (default "Joined")
#     link                  optional { href, label }
#     achievements:         stations along the line (YAML order = map order)
#       - name              playful achievement name
#         station           short plain label shown on the map (defaults to name)
#         detail            the plain fact, one or two sentences
#         metric            optional headline figure, e.g. "75%"
#         metricLabel       what the figure measures, e.g. "shorter test runs"
#         date              optional; undated stations sit within their line
#         skills            optional list of skill tags
#         featured          optional; featured stops appear on the first screen
#         link              optional { href, label }
#   - kind: event           a single dated moment: certification, launch, degree
#     id, title, date, org, detail, tag, skills, featured, link
#     on                    optional span id to place the event on that line;
#                           without it, the event becomes the station where the
#                           next line to start departs from

