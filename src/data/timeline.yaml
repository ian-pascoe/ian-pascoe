# Ian Pascoe's career, laid out as matter on an accretion disk: every
# achievement is a fragment on the ring of its date. This file is the only
# source for the site and for /resume. Achievement names are playful titles;
# the detail beside each one is the plain fact.
#
# Public-content rules: name Windchill and AWS; percentages are fine; never
# publish dollar amounts or team sizes.
#
# Dates are "YYYY", "YYYY-MM", or "YYYY-MM-DD". Spans end with `end: present`
# while they are ongoing. The build validates this file and fails with a clear
# message if something is missing or misspelled.
#
# entries:
#   - kind: span            a role, company, or degree; one band of the fall
#     id, title, org, start, end, summary
#     mark                  optional logo set at the band's head; one of
#                           the names in src/lib/marks.ts (rtx, spirit-led, uri, ...)
#     startLabel            verb for how the band opens, e.g. "Founded" (default "Joined")
#     link                  optional { href, label }
#     achievements:         the band's fragments (YAML order = reading order
#                           among undated ones)
#       - name              the achievement's title (playful)
#         detail            optional; the plain fact the figure and title don't
#                           already say, in one sentence
#         metric            optional figure, one of:
#                             "75%"        a reduction
#                             "+30%"       an increase
#                             "5", "300+"  a count
#                             "1st of 15"  a ranking
#         metricLabel       what the figure measures, e.g. "shorter test runs"
#         subject           short plain name of what was made; without a
#                           metric it is set as the plate's headline
#         date              optional; undated fragments fall between their
#                           band's start and its first dated fragment, with no
#                           date shown
#         skills            optional list of skill tags (the medium);
#                           tags named in src/lib/marks.ts get their glyph
#         featured          optional; featured fragments are the brightest on
#                           the first screen
#         link              optional { href, label }
#         status            optional: in-progress or retired, shown on the plate
#   - kind: event           a single dated moment: certification, launch, degree
#     id, title, date, org, detail, tag, skills, featured, link
#     mark                  optional issuer logo, shown on the plate
#     on                    optional span id to set the event in that band;
#                           without it the event gets a band of its own, named
#                           after its org

